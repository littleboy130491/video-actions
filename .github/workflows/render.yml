name: render

on:
  workflow_dispatch:
    inputs:
      bundle:
        description: "Bundle id (file bundles/<id>.enc)"
        required: true
      scenes:
        description: 'JSON list of scene names, e.g. ["s1_hook","s2_brief"]'
        required: true
      chunks:
        description: 'JSON list of chunk indexes per scene, e.g. [0,1,2,3] (its length = chunk count)'
        default: "[0,1,2,3]"
      draft:
        description: "Draft: no motion blur (fast)"
        type: boolean
        default: false
      finalize:
        description: "Join parts, concat all scenes (+ sfx)"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  chunk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        scene: ${{ fromJSON(inputs.scenes) }}
        chunk: ${{ fromJSON(inputs.chunks) }}
    steps:
      - uses: actions/checkout@v4
      - name: Unpack
        env: { RENDER_KEY: "${{ secrets.RENDER_KEY }}" }
        run: bash scripts/unpack.sh "bundles/${{ inputs.bundle }}.enc" work
      - name: Setup
        run: bash scripts/setup.sh work
      - name: Render chunk
        env:
          K: ${{ strategy.job-total }}
        run: |
          COUNT=$(python3 -c "import json;print(len(json.loads('${{ inputs.chunks }}')))")
          python3 scripts/render_chunk.py work "${{ matrix.scene }}" "${{ matrix.chunk }}" "$COUNT" ${{ inputs.draft && '--draft' || '' }}
      - name: Encrypt output
        env: { RENDER_KEY: "${{ secrets.RENDER_KEY }}" }
        run: bash scripts/seal_out.sh work PARTS
      - uses: actions/upload-artifact@v4
        with:
          name: part-${{ matrix.scene }}-${{ matrix.chunk }}
          path: sealed/*.enc
          if-no-files-found: ignore
          retention-days: 3

  finalize:
    if: ${{ inputs.finalize }}
    needs: chunk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack
        env: { RENDER_KEY: "${{ secrets.RENDER_KEY }}" }
        run: bash scripts/unpack.sh "bundles/${{ inputs.bundle }}.enc" work
      - name: Setup
        run: bash scripts/setup.sh work --light
      - uses: actions/download-artifact@v4
        with: { pattern: "part-*", path: sealed_in, merge-multiple: true }
      - name: Decrypt parts
        env: { RENDER_KEY: "${{ secrets.RENDER_KEY }}" }
        run: bash scripts/open_in.sh sealed_in work
      - name: Join parts, concat, sfx
        working-directory: work
        run: |
          bash ../scripts/join_parts.sh .
          python3 engine*/render2.py --concat-only
          if ls out*/sfx_events.json >/dev/null 2>&1; then for s in engine*/sfx.py; do [ -f "$s" ] && python3 "$s"; done; else echo "no sfx_events.json in bundle: skipping sfx (render a local --draft first)"; fi
      - name: Encrypt final
        env: { RENDER_KEY: "${{ secrets.RENDER_KEY }}" }
        run: bash scripts/seal_out.sh work FINAL
      - uses: actions/upload-artifact@v4
        with: { name: final, path: sealed/*.enc, retention-days: 7 }

  publish:
    # artifacts live on Azure blob storage, unreachable from some environments -> also push the sealed
    # (encrypted) outputs to a throwaway branch out-<run_id> so they can be fetched with plain git.
    if: ${{ always() && needs.chunk.result == 'success' }}
    needs: [chunk, finalize]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: got, merge-multiple: true }
      - name: Push sealed outputs to branch
        env:
          GH_TOKEN: ${{ github.token }}
          BR: out-${{ github.run_id }}
        run: |
          mkdir pub && cd pub && git init -q -b "$BR"
          cp ../got/*.enc . 2>/dev/null || true
          ls -la
          git -c user.name=render-bot -c user.email=render-bot@users.noreply.github.com add -A
          git -c user.name=render-bot -c user.email=render-bot@users.noreply.github.com commit -q -m "sealed outputs ${{ github.run_id }}"
          git push -q "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" "$BR"
